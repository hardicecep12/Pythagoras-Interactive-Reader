<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pythagoras Interactive Reader</title>
  <link rel="stylesheet" href="css/style.css">
  
  <!-- Pustaka Lokal Marked (Markdown Parser) -->
  <script src="lib/marked/marked.min.js"></script>

  <!-- Pustaka Lokal KaTeX (Math Renderer) -->
  <link rel="stylesheet" href="lib/katex/katex.min.css">
  <script defer src="lib/katex/katex.min.js"></script>
  <script defer src="lib/katex/contrib/auto-render.min.js"></script>
</head>
<body>

  <div class="reader-card">
    <!-- BAR ATAS TERKUNCI -->
    <header class="reader-header">
      <div class="window-dots">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
      </div>
      <div class="header-title">Teorema Pythagoras</div>
      <div class="header-actions">
        <div class="brightness-toggle">
          <label for="brightnessRange">Kecerahan</label>
          <input type="range" id="brightnessRange" min="60" max="100" value="100">
        </div>

        <!-- TOMBOL 1: FULLSCREEN SEMU (Debugging Dalam Tab) -->
        <button id="fullscreenToggleBtn" class="icon-btn" title="Fullscreen Semu" type="button">
          <svg id="pseudoIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"></path>
          </svg>
        </button>

        <!-- TOMBOL 2: TRUE NATIVE FULLSCREEN (Layar Penuh Membawa Background Warna-Warni) -->
        <button id="trueFullscreenBtn" class="icon-btn" title="True Fullscreen" type="button">
          <svg id="trueIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
          </svg>
        </button>

        <button id="burgerBtn" class="burger-btn" aria-label="Menu Navigasi">
          <span></span><span></span><span></span>
        </button>
      </div>
    </header>

    <!-- AREA UTAMA DENGAN SCROLL MANDIRI -->
    <div class="reader-body">
      <nav id="sidebar" class="page-drawer">
        <div class="drawer-title">DAFTAR LESSON</div>
        <div id="lessonNav" class="lesson-nav"></div>
      </nav>

      <main class="main-content">
        <article id="lessonContent"></article>
        <div id="interactiveArea" class="interactive-area"></div>
      </main>

      <aside class="sidebar-panel">
        <div class="panel-block">
          <div class="panel-title">GLOSARIUM</div>
          <div id="glossaryContent" class="panel-text"></div>
        </div>
        <div class="panel-block">
          <div class="panel-title">CATATAN PRIBADI</div>
          <textarea id="personalNotes" class="notes-input" placeholder="Tulis catatan penting di sini..."></textarea>
        </div>
      </aside>
    </div>
  </div>

  <!-- Pemuatan Konfigurasi & Materi -->
  <script defer src="config/lessons.js"></script>

  <script defer src="content/00-dashboard.js"></script>
  <script defer src="content/01-konsep-dasar.js"></script>
  <script defer src="content/02-tripel-pythagoras.js"></script>
  <script defer src="content/03-segitiga-istimewa.js"></script>
  <script defer src="content/04-penerapan-nyata.js"></script>

  <!-- Pemuatan Skrip Utama Aplikasi -->
  <script defer src="js/widgets.js"></script>
  <script defer src="js/md-loader.js"></script>
  <script defer src="js/app.js"></script>
</body>
</html>
